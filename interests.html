<!DOCTYPE html>
<html>
<head>
  <title>Sean Avery Lim Co — Interests</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header id="header">
    <h2>Who am I?</h2>
    <nav id="nav">
      <a href="index.html">Home</a>
      <a href="interests.html">Interests</a>
    </nav>
  </header>

  <main id="separator">

    <div id="first-row">
      <article class="interest-card" id="basketball">
        <h3>Basketball</h3>
        <p>I enjoy playing basketball with my friends.</p>
        <div class="spacing"><span class="bold">Favorite Player:</span> LeBron James</div>
        <img src="Lebron.png" alt="LeBron James" width="200">
        <audio controls>
          <source src="Basketball.mp3" type="audio/mpeg">
        </audio>
      </article>

      <article class="interest-card" id="videogames">
        <h3>Video Games</h3>
        <p>I like playing video games.</p>
        <video controls width="400">
          <source src="Valorant.mp4" type="video/mp4">
        </video>
      </article>
    </div>

    <div id="second-row">
      <article class="card interest-card" id="anime">
        <h3>Anime</h3>
        <p>I watch anime in my spare time.</p>
        <div class="spacing"><span class="bold">Favorite:</span> One Piece</div>
        <img src="OnePiece.jpg" alt="One Piece" width="200">
      </article>
    </div>

    <section class="card" id="contact">
      <h3>Get in Touch</h3>
      <div id="contact-form">
        <div class="get-in-touch">
          <div class="contact">
            <label for="contact-name">Name</label>
            <input type="text" id="contact-name" name="name">
          </div>

          <div class="contact">
            <label for="contact-email">Email</label>
            <input type="email" id="contact-email" name="email">
          </div>
          <button id="button-send">Send</button>
        </div>

        <div class="contact-interests">
          <p>Similar Interests?</p>
          <div class="checkbox-row">
            <input type="checkbox" id="checkbox-basketball" name="basketball">
            <label for="checkbox-basketball">Basketball</label>
          </div>
          
          <div class="checkbox-row">
            <input type="checkbox" id="checkbox-videogames" name="videogames">
            <label for="checkbox-videogames">Video Games</label>
          </div>
          <div class="checkbox-row">
            <input type="checkbox" id="checkbox-anime" name="anime">
            <label for="checkbox-anime">Anime</label>
          </div>
        </div>
      </div>
    </section>

    <section class="card" id="socials">
      <h3>Socials</h3>
      <a class="social" href="https://github.com/SeanCo16" target="_blank">Link to my Github</a>
      <a class="social" href="https://www.instagram.com/seann.co/" target="_blank">Link to my Instagram</a>
    </section>

  </main>

</body>
</html>
